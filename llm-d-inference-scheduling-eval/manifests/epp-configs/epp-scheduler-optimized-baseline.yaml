# LLMInferenceServiceConfig: previous upstream optimised baseline EPP configuration.
# Only overrides the EndpointPickerConfig; inherits container spec,
# TLS, and probes from the RHOAI default scheduler template.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: epp-scheduler-optimized-baseline
  namespace: llm-d-nathans-epp-eval
spec:
  router:
    scheduler:
      config:
        ref:
          name: epp-config-optimized-baseline
          key: config.yaml
