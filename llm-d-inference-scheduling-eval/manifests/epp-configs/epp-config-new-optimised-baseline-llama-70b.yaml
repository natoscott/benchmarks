# EPP EndpointPickerConfig: new upstream optimised baseline for llama-70b.
# peakPrefillThroughput calibrated on H200 TP=2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config-new-optimised-baseline-llama-70b
  namespace: llm-d-nathans-epp-eval
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: approx-prefix-cache-producer
    - type: inflight-load-producer
    - type: prefix-cache-affinity-filter
      parameters:
        peakPrefillThroughput: 101012
    - type: token-load-scorer
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
