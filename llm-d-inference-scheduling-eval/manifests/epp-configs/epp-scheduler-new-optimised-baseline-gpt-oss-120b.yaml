# LLMInferenceServiceConfig: new upstream optimised baseline (filter+scorer).
# Overrides EPP container image and command for upstream build compatibility.
# The upstream image does not support RHOAI-specific flags like
# --model-server-metrics-scheme, so the full command is specified here.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: epp-scheduler-new-optimised-baseline-gpt-oss-120b
  namespace: llm-d-nathans-epp-eval
spec:
  router:
    scheduler:
      config:
        ref:
          name: epp-config-new-optimised-baseline-gpt-oss-120b
          key: config.yaml
      template:
        containers:
        - name: main
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:main
          imagePullPolicy: Always
          command:
          - /app/epp
          - --pool-name
          - '{{ ChildName .ObjectMeta.Name `-inference-pool` }}'
          - --pool-namespace
          - '{{ .ObjectMeta.Namespace }}'
          - --zap-encoder
          - json
          - --grpc-port
          - "9002"
          - --grpc-health-port
          - "9003"
          - --secure-serving=false
          - --metrics-endpoint-auth=false
